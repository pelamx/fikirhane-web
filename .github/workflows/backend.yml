name: backend

on:
  push:
    branches: [main]
    paths: ['backend/**', 'scripts/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'scripts/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Tests run against a real PostgreSQL started by embedded-postgres.
      - run: npm test
