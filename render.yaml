# Render Blueprint: PostgreSQL + the API container, which also serves the site (one origin, Lax cookies).
# Render dashboard → New → Blueprint → this repository. Details: backend/README.md#render
databases:
  - name: fikirhane-db
    databaseName: fikirhane
    user: fikirhane
    plan: free              # free databases expire after 30 days; use basic-256mb or larger for real data
    region: frankfurt
    postgresMajorVersion: "18"
    ipAllowList: []         # internal network only; the first admin comes from BOOTSTRAP_ADMIN_EMAIL on the service

services:
  - type: web
    name: fikirhane
    runtime: docker
    plan: free              # free instances sleep after 15 minutes idle; starter keeps them up
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass   # deploy main only after the backend workflow passes
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fikirhane-db
          property: connectionString
      - key: PORT
        value: "8080"
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SAMESITE
        value: Lax
      - key: COOKIE_SECURE
        value: "true"
      - key: PAYMENT_MODE
        value: pay_at_venue
      - key: SEED_DEMO
        value: "true"
      # Kitchen tabs (mutfak/): "test" shows a stand-in card page (no money moves) so the flow can be tried; switch to
      # "iyzico" with the keys below once the merchant contract is signed (IYZICO_BASE_URL: https://api.iyzipay.com live,
      # https://sandbox-api.iyzipay.com sandbox). "off": tabs are paid at the desk (host shell → Kafeterya → Açık hesaplar).
      - key: KITCHEN_PAYMENT
        value: test
      - key: IYZICO_API_KEY
        sync: false
      - key: IYZICO_SECRET_KEY
        sync: false
      - key: IYZICO_BASE_URL
        sync: false
      # First admin, created on start if the account does not exist (the free plan has no shell for create-admin).
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # "Ad Soyad"; also replaces the placeholder name "Fikirhane Admin" on an admin created without it.
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      # Forgot-password emails. Brevo sends to anyone from one verified address (no domain needed); Resend needs a verified
      # domain to reach anyone but its own account. Set one key; leave both empty to have the team create reset links instead.
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # The sender: "Fikirhane <address>". With Brevo it must be the sender address verified there.
      - key: MAIL_FROM
        sync: false
